services:
  trading-engine:
    build: .
    container_name: trading-engine
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./sandbox:/app/sandbox
      - ./src:/app/src  # 코드 변경 시 restart만으로 반영 (rebuild 불필요)
    environment:
      - TZ=Asia/Seoul
      - PYTHONUNBUFFERED=1
    mem_limit: 600m
    memswap_limit: 600m
    cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys; sys.exit(0 if os.path.exists('/app/src/main.py') else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
